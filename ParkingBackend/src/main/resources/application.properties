spring.application.name=ParkingBackend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# WebSocket Configuration
spring.websocket.servlet.path=/ws

# Logging Configuration
logging.level.root=INFO
logging.level.com.project.parkingbackend=DEBUG

# Jackson Configuration
spring.jackson.serialization.INDENT_OUTPUT=true
spring.jackson.serialization.WRITE_EMPTY_JSON_ARRAYS=true

# AI Integration Configuration
ai.base-url=http://127.0.0.1:8000
ai.websocket-url=ws://127.0.0.1:8000/ws/live
ai.map-poll-interval-ms=1000
ai.gate-match-max-retries=5
ai.gate-match-retry-delay-ms=1200
ai.ws-reconnect-base-delay-ms=1000
ai.ws-reconnect-max-delay-ms=15000
ai.http-timeout-ms=6000

